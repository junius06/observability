apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.initFiles.configMapName }}
  namespace: {{ include "grafana-postgres.namespaceName" . }}
  labels:
    {{- include "grafana-postgres.labels" . | nindent 4 }}
data:
  01-init.sql: |
      -- ✅ 1) fmmsysops 유저가 없으면 생성, 있으면 비밀번호만 맞춰둠
      DO $$
      BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'fmmsysops') THEN
         CREATE ROLE fmmsysops LOGIN PASSWORD 'fmmsysops2025!!';
      ELSE
         ALTER ROLE fmmsysops WITH LOGIN PASSWORD 'fmmsysops2025!!';
      END IF;
      END$$;

      -- ✅ 2) grafana DB가 없으면 생성(소유자 fmmsysops)
      -- CREATE DATABASE 는 트랜잭션 밖에서 실행해야 하므로 \gexec 사용
      SELECT 'CREATE DATABASE grafana OWNER fmmsysops'
      WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'grafana')\gexec

      -- ✅ 2b) 이미 grafana DB가 있다면 소유자를 보정
      DO $$
      BEGIN
      IF EXISTS (SELECT 1 FROM pg_database WHERE datname = 'grafana') THEN
         EXECUTE 'ALTER DATABASE grafana OWNER TO fmmsysops';
      END IF;
      END$$;

      -- ✅ 3) DB 접속/생성 권한 보장 (소유자면 불필요하지만 안전망으로 부여)
      GRANT CONNECT, TEMP, CREATE ON DATABASE grafana TO fmmsysops;

      -- ✅ 4) grafana DB에 접속해 스키마/기본권한 정리
      \connect grafana

      -- 스키마 접근
      GRANT USAGE ON SCHEMA public TO fmmsysops;

      -- 이미 존재하는 객체 권한 (있으면 부여)
      GRANT ALL PRIVILEGES ON ALL TABLES    IN SCHEMA public TO fmmsysops;
      GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO fmmsysops;
      GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public TO fmmsysops;

      -- 앞으로 생성될 객체들의 기본 권한
      ALTER DEFAULT PRIVILEGES FOR ROLE fmmsysops IN SCHEMA public
      GRANT ALL ON TABLES    TO fmmsysops;
      ALTER DEFAULT PRIVILEGES FOR ROLE fmmsysops IN SCHEMA public
      GRANT ALL ON SEQUENCES TO fmmsysops;
      ALTER DEFAULT PRIVILEGES FOR ROLE fmmsysops IN SCHEMA public
      GRANT ALL ON FUNCTIONS TO fmmsysops;