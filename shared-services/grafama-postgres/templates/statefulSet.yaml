apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "grafana-postgres.fullname" . }}
  namespace: {{ include "grafana-postgres.namespaceName" . }}
  labels:
    {{- include "grafana-postgres.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "grafana-postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "grafana-postgres.selectorLabels" . | nindent 8 }}
        {{- include "grafana-postgres.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # serviceAccountName: {{ include "grafana-postgres.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PGDATA
              value: "{{ .Values.persistence.mountPath }}/{{ .Values.pgdataSubdir | default "pgdata" }}"
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}
          ports:
            - name: {{ .Values.service.name }}
              protocol: {{ (index .Values.service.ports 0).protocol | default "TCP" }}
              containerPort: {{ (index .Values.service.ports 0).port }}
          {{- if .Values.probes.readinessProbe.enabled }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "admin", "-d", "postgres", "-h", "127.0.0.1"]
            initialDelaySeconds: {{ .Values.probes.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readinessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "admin", "-d", "postgres", "-h", "127.0.0.1"]
            initialDelaySeconds: {{ .Values.probes.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.livenessProbe.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: {{ .Values.persistence.name }}
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if .Values.initFiles.enabled }}
            - name: init
              mountPath: {{ .Values.initFiles.mountPath }}
            {{- end }}
      {{- if .Values.initFiles.enabled }}
      volumes:
        - name: init
          configMap:
            name: {{ .Values.initFiles.configMapName }}
            defaultMode: {{ (.Values.initFiles.defaultMode) | int }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    {{- if .Values.persistence.enabled }}
    - metadata:
        name: {{ .Values.persistence.name }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        storageClassName: {{ .Values.persistence.storageClassName }}
    {{- end }}